buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Keep generated Android outputs out of the OneDrive-synced project tree.
def localBuildRoot = new File(
    System.getenv("LOCALAPPDATA") ?: new File(System.getProperty("user.home"), ".cache").absolutePath,
    "UniVents/gradle-build"
)
subprojects { subproject ->
    subproject.layout.buildDirectory.set(new File(localBuildRoot, subproject.name))

    // On Windows, the NDK exposes libc++_shared.so as a hard link for
    // react-native-screens. Gradle 9.4 incorrectly treats that output as a
    // non-regular file while snapshotting the CMake task, so disable state
    // tracking for these native build tasks only.
    if (System.getProperty("os.name").toLowerCase().contains("windows") &&
            subproject.name == "react-native-screens") {
        subproject.tasks.configureEach { task ->
            if (task.name.startsWith("buildCMakeDebug")) {
                task.doNotTrackState("Gradle cannot snapshot the NDK libc++ hard link on Windows.")
                task.doLast {
                    task.outputs.files.files.each { File output ->
                        if (!output.exists()) return
                        def regularize = { File artifact ->
                            if (artifact.name == "libc++_shared.so" && artifact.isFile()) {
                                byte[] contents = artifact.bytes
                                if (!artifact.delete()) {
                                    throw new GradleException("Could not replace NDK hard link: ${artifact}")
                                }
                                artifact.withOutputStream { stream -> stream.write(contents) }
                            }
                        }
                        if (output.isDirectory()) {
                            output.eachFileRecurse { File artifact -> regularize(artifact) }
                        } else {
                            regularize(output)
                        }
                    }
                }
            }
        }
    }
}
