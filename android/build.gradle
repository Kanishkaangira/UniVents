buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    // The Windows NDK and Gradle transform cache can expose shared libraries
    // as hard links. Gradle 9.4 cannot snapshot those files as CMake outputs.
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        if (subproject.name == "react-native-screens") {
            def localBuildRoot = new File(System.getenv("LOCALAPPDATA") ?: System.getProperty("java.io.tmpdir"), "UniVents/android-build/react-native-screens")
            subproject.layout.buildDirectory.set(localBuildRoot)
        }
        subproject.tasks.configureEach { task ->
            if (task.name == "generateCodegenArtifactsFromSchema" || task.name.startsWith("buildCMakeDebug")) {
                task.doNotTrackState("Gradle cannot snapshot generated or native linked files on Windows.")
            }
            if (task.name.startsWith("buildCMakeDebug")) {
                task.doLast {
                    task.outputs.files.files.each { File output ->
                        if (!output.exists()) return
                        def regularize = { File artifact ->
                            if (artifact.name.endsWith(".so") && artifact.isFile()) {
                                byte[] contents = artifact.bytes
                                if (!artifact.delete()) {
                                    throw new GradleException("Could not replace native library hard link: ${artifact}")
                                }
                                artifact.withOutputStream { stream -> stream.write(contents) }
                            }
                        }
                        if (output.isDirectory()) {
                            output.eachFileRecurse { File artifact -> regularize(artifact) }
                        } else {
                            regularize(output)
                        }
                    }
                }
            }
        }
    }
}
